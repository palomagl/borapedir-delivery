<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BRUTO">
  <!--
    O bloco vermelho é o que faz a marca ser achada numa fileira de abas:
    fundo escuro se confunde com meia dúzia de outros favicons escuros.

    O hambúrguer é vazado em carvão, e a "carne" é o próprio vermelho do
    fundo aparecendo entre as duas formas. Duas peças, nenhum detalhe fino —
    é o que sobrevive a 16 px.
  -->
  <rect width="64" height="64" rx="13" fill="#ff4b2b"/>
  <path d="M13 28a19 14 0 0 1 38 0Z" fill="#0e0e0e"/>
  <path d="M13 44h38v3a5 5 0 0 1-5 5H18a5 5 0 0 1-5-5Z" fill="#0e0e0e"/>
</svg>
